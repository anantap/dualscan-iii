# XcodeGen project. Generate with:  xcodegen generate   (build.sh does this)
name: DualScan
options:
  bundleIdPrefix: nl.ananta
  deploymentTarget:
    macOS: "14.0"   # keep the same as MACOSX_DEPLOYMENT_TARGET in scripts/build-sane.sh
  createIntermediateGroups: true

targets:
  DualScan:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      # The SANE config the driver reads (avision only), from ../sane (scripts/build-sane.sh).
      - path: ../sane/etc/sane.d
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Dual Scan III
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: For personal use.
    settings:
      base:
        PRODUCT_NAME: Dual Scan III
        PRODUCT_BUNDLE_IDENTIFIER: nl.ananta.dualscan3
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Universal: Apple silicon and Intel (the SANE build is both too).
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        # The SANE driver from ../sane (scripts/build-sane.sh), linked in statically with libusb,
        # so the app needs nothing outside itself and can update itself.
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../sane/include
        OTHER_LDFLAGS: >-
          $(PROJECT_DIR)/../sane/lib/libsane.a
          $(PROJECT_DIR)/../sane/lib/libusb-static.a
          -framework IOKit -framework CoreFoundation -framework Security
        # Ad-hoc signing: runs on this Mac without a developer account.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
