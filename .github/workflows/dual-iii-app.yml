name: Dual III app

# Builds Dual Scan III on a Mac (with the SANE driver inside), runs the self-test on the simulated
# Dual III, and publishes it as the latest release, tagged build-<n>. The app updates itself from it.
# To share it: https://github.com/anantap/dualscan-iii/releases/latest
# Other branches build and run the same checks, without publishing.
on:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/dual-iii-app.yml'
  workflow_dispatch:

concurrency:
  group: dual-iii-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 builds it; the app itself runs on macOS 14 and later.
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      APP: "app/build/Dual Scan III.app"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the release notes list the commits since the last release

      - name: Build number
        # A local build is build 1 and never updates, so the first build here is 2.
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: brew install autoconf autoconf-archive automake libtool pkgconf gettext xcodegen

      - name: Reuse the SANE build
        uses: actions/cache@v4
        with:
          path: sane
          key: sane-${{ runner.os }}-${{ hashFiles('scripts/build-sane.sh', 'scripts/sane-patches/**') }}

      - name: Build the app
        run: |
          xcodebuild -version
          ./app/build.sh

      - name: Check the app
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "nl.ananta.dualscan3"
          test -f "$APP/Contents/Resources/sane.d/dll.conf"
          # Universal, for macOS 14 and later.
          lipo -archs "$APP/Contents/MacOS/Dual Scan III" | tee /dev/stderr | grep -q 'x86_64 arm64\|arm64 x86_64'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "14.0"
          vtool -show-build "$APP/Contents/MacOS/Dual Scan III" | grep -E 'minos'
          if vtool -show-build "$APP/Contents/MacOS/Dual Scan III" | grep -E 'minos (1[5-9]|2[0-9])\.'; then exit 1; fi
          test -f "$APP/Contents/Resources/Fonts/geist-latin.woff2"
          # Nothing outside the app and macOS: no Homebrew, no SANE folder.
          if otool -L "$APP/Contents/MacOS/Dual Scan III" | grep -E '/opt/homebrew|/usr/local|/sane/'; then exit 1; fi

      - name: Run the self-test
        run: |
          OUT="$RUNNER_TEMP/selftest"
          "$APP/Contents/MacOS/Dual Scan III" --selftest "$OUT" &
          PID=$!
          for i in $(seq 1 480); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null && { echo "The self-test didn't finish"; exit 1; } || true
          cat "$OUT/log.txt"
          grep -q 'pixels identical' "$OUT/log.txt"       # earlier strips read back exactly
          grep -q 'ejected by itself' "$OUT/log.txt"       # auto-eject after the queue
          grep -q 'exported 10 base TIFFs' "$OUT/log.txt"  # numbers continue: no overwrites
          mkdir -p selftest && cp "$OUT"/*.png "$OUT/log.txt" selftest/

      - name: Run the Intel build too
        # Under Rosetta, when the runner has it: the app starts and finds no scanner.
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            OUT="$RUNNER_TEMP/selftest-intel"
            arch -x86_64 "$APP/Contents/MacOS/Dual Scan III" --selftest "$OUT" &
            PID=$!
            for i in $(seq 1 600); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            kill $PID 2>/dev/null && { echo "The Intel self-test didn't finish"; exit 1; } || true
            grep -q 'exported 10 base TIFFs' "$OUT/log.txt" && echo "Intel self-test passed"
          else
            echo "No Rosetta on this runner; skipped."
          fi

      - name: Package the app
        run: ditto -c -k --keepParent "$APP" Dual-Scan-III.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Dual-Scan-III
          path: |
            Dual-Scan-III.zip
            selftest/
          retention-days: 30

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The fixes since the previous release, app changes only: the update popup lists them.
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          NOTES=$(git log ${PREV:+$PREV..}HEAD --no-merges --pretty='- %s' -- app scripts | head -40)
          [ -n "$NOTES" ] || NOTES="- $(git log -1 --pretty=%s)"
          gh release create "build-$BUILD_NUMBER" Dual-Scan-III.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Dual Scan III, build $BUILD_NUMBER" \
            --notes "$NOTES"
